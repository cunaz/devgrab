name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    name: Build and publish the package
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check that the tag matches manifest.json
        run: test "v$(node -p "require('./manifest.json').version")" = "$GITHUB_REF_NAME"
      - name: Unit and integration tests
        run: npm test
      - name: Lint (addons-linter)
        run: npm run lint
      - name: Build the package
        run: npm run build
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "DevGrab ${GITHUB_REF_NAME#v}" --generate-notes
