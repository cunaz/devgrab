name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    name: Build and publish the package
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Check that the tag matches manifest.json
        run: test "v$(node -p "require('./manifest.json').version")" = "$GITHUB_REF_NAME"
      - name: Unit and integration tests
        run: npm test
      - name: Lint (addons-linter)
        run: npm run lint
      - name: Build the package
        run: npm run build
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" web-ext-artifacts/*.zip \
            --title "DevGrab ${GITHUB_REF_NAME#v}" --generate-notes
